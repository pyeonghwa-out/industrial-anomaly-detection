[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iad"
version = "0.1.0"
description = "Training-free unsupervised industrial anomaly detection & localization on MVTec AD."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SHARANcanCODE" }]
keywords = [
    "anomaly-detection",
    "computer-vision",
    "mvtec",
    "patchcore",
    "padim",
    "industrial-inspection",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "scikit-image>=0.19",
